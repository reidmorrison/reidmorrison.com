---
layout: default
---

<article>
  <h1>{{ page.title }}</h1>
  <p class="project-meta">
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
    {% if page.tags and page.tags.size > 0 %}&middot; {{ page.tags | join: ", " }}{% endif %}
  </p>

  {{ content }}
</article>

<p><a href="{{ '/index.html' | relative_url }}">&larr; Home</a></p>
