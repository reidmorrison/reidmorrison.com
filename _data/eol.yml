# Rails and Ruby end-of-life data behind the exposure check at /eol/.
#
# THE SINGLE SOURCE FOR THESE DATES. They were previously hardcoded in the
# calculator's JavaScript; they live here so the page, and any future report,
# read the same numbers. `eol.html` renders this file with `jsonify`, so a
# change here changes the tool with no JavaScript edit.
#
# RE-VERIFY BEFORE PUTTING ANY OF THIS IN FRONT OF A COMPLIANCE OFFICER.
# Dates move, and a wrong control number costs more than the page earns.
# Next scheduled change: Rails 8.0 reaches end of life 2026-11-07.
#
# Sources:
#   EOL dates          https://endoflife.date/rails and https://endoflife.date/ruby
#   Version ceilings    https://www.fastruby.io/blog/ruby/rails/versions/compatibility-table.html
#   Controls            PCI DSS v4.0.1 (never cite 4.0, retired 2024-12-31),
#                       SOC 2 Trust Services Criteria, 45 CFR Part 164,
#                       ISO/IEC 27001:2022
#
# Fields on each rails entry:
#   v     Version series.
#   eol   End-of-life date, ISO. Quoted so YAML keeps it a string.
#   min   Minimum Ruby this Rails series supports.
#   max   MAXIMUM Ruby this Rails series supports. This is the field that makes
#         the tool worth using: old Rails caps Ruby, which is what traps people.

verified: "2026-08-27"

target_rails: "8.1"
target_ruby: "3.4"

rails:
  - { v: "4.2", eol: "2017-04-27", min: "2.0", max: "2.3" }
  - { v: "5.0", eol: "2018-04-09", min: "2.2", max: "2.4" }
  - { v: "5.1", eol: "2019-08-25", min: "2.2", max: "2.5" }
  - { v: "5.2", eol: "2022-06-01", min: "2.2", max: "2.6" }
  - { v: "6.0", eol: "2023-06-01", min: "2.5", max: "2.7" }
  - { v: "6.1", eol: "2024-10-01", min: "2.5", max: "3.1" }
  - { v: "7.0", eol: "2025-04-01", min: "2.7", max: "3.3" }
  - { v: "7.1", eol: "2025-10-01", min: "2.7", max: "3.3" }
  - { v: "7.2", eol: "2026-08-09", min: "3.1", max: "3.4" }
  - { v: "8.0", eol: "2026-11-07", min: "3.2", max: "3.4" }
  - { v: "8.1", eol: "2027-10-10", min: "3.2", max: "3.4" }

ruby:
  - { v: "2.4", eol: "2020-03-31" }
  - { v: "2.5", eol: "2021-03-31" }
  - { v: "2.6", eol: "2022-03-31" }
  - { v: "2.7", eol: "2023-03-31" }
  - { v: "3.0", eol: "2024-04-23" }
  - { v: "3.1", eol: "2025-03-26" }
  - { v: "3.2", eol: "2026-03-31" }
  - { v: "3.3", eol: "2027-03-31" }
  - { v: "3.4", eol: "2028-03-31" }

controls:
  - framework: PCI DSS 4.0.1
    control: "12.3.4"
    requires: >-
      Review at least every 12 months confirming each component still receives
      vendor security fixes. Where it does not, a remediation plan approved by
      senior management is required.
  - framework: PCI DSS 4.0.1
    control: "6.3.3"
    requires: >-
      Critical and high-security patches installed within one month of release.
      An unsupported version cannot receive them.
  - framework: PCI DSS 4.0.1
    control: "6.3.2"
    requires: >-
      Inventory of bespoke and custom software, and the third-party components
      incorporated into it.
  - framework: SOC 2
    control: CC7.1
    requires: Detection of susceptibility to newly discovered vulnerabilities.
  - framework: SOC 2
    control: CC6.8
    requires: Controls over unsupported software and patch service levels.
  - framework: HIPAA
    control: 45 CFR 164.308(a)(1)(ii)(A)-(B)
    requires: >-
      Risk analysis and risk management. Documented awareness of an unpatched
      component without action is the exposure.
  - framework: HIPAA
    control: 45 CFR 160.404
    requires: >-
      Penalty tiers scale by culpability. Documented awareness moves you toward
      willful neglect.
  - framework: ISO 27001:2022
    control: Annex A 8.8
    requires: Management of technical vulnerabilities.
