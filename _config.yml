# Site identity. jekyll-seo-tag reads these for every page, so they set how the
# whole site is described in search results and link previews. They were the
# job-search positioning until 2026-08-28; this site now sells a service.
title: Reid Morrison Consulting
tagline: EOL Remediation
description: >-
  Reid Morrison Consulting. End-of-life remediation for Rails applications in
  PCI DSS, SOC 2, HIPAA and ISO 27001 scope. Fixed-price upgrades off unsupported
  Rails and Ruby versions, delivered by a principal engineer with twenty years in
  regulated systems.
url: https://reidmorrison.com
author: Reid Morrison

github_username: reidmorrison
linkedin_username: reidmorrison

# Kramdown settings match the project doc sites so markdown behaves identically
# across reidmorrison.com and logger/encryption/rocketjob/etc.
markdown: kramdown
kramdown:
  toc_levels: "2..3"

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Web3Forms access key for the lead form on /eol/. Public by design; it only
# identifies the destination inbox, it does not grant access to anything.
#
# CREATE IT WITH THE PUBLIC SALES ALIAS AT https://web3forms.com/ - submissions
# are delivered to whichever address the key was created with, and that address
# is the one that should receive them. The alias is deliberately not written
# down in this repo, which is public; see CLAUDE.md.
#
# While this is empty the form is NOT rendered and /eol/ points people at
# LinkedIn instead. That is deliberate: a form that discards submissions is
# worse than no form. Paste the key here and the form appears.
# Video call booking link, shown on /contact.html and the home page when set.
# Empty means no booking button is rendered anywhere, and the contact form is
# the only route. Cal.com's free plan allows several event types; Calendly's
# free plan allows one.
booking_url: ""

web3forms_key: "018411c9-90f9-4b0f-aa92-b3c080d2c362"

feed:
  path: feed.xml

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      # Blog posts live under /writing/. No posts yet, and no index page:
      # the scaffold is kept so a future post gets a URL and a feed entry.
      # Scoped to posts rather than set globally: a top-level `permalink` key
      # switches *pages* to pretty URLs too (about/index.html), which breaks the
      # .html nav links shared with the project doc sites.
      permalink: /writing/:year/:month/:day/:title/

exclude:
  - Gemfile
  - Gemfile.lock
  - CLAUDE.md
  - README.md
  - vendor
  # The logo master is untracked, so it is absent from a fresh clone and from
  # the Pages build. Excluding it keeps a local build byte-identical to
  # production for whoever has a copy sitting in images/. See CLAUDE.md.
  - images/reid-morrison-consulting.png
