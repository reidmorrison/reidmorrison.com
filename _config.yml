# Site identity. jekyll-seo-tag reads these for every page, so they decide how
# the site appears in search results and link previews.
#
# Company Name
title: Reid Morrison Inc.

# The entity name carries no descriptor, so `tagline` does that work. It is
# currently inert: jekyll-seo-tag uses it only for the site root, and only when
# that page sets no `title` of its own, which index.md does. Keep it right
# anyway, because it becomes the tab the day the home page drops its title.
# `description` is the string that actually ships on every page.
tagline: Fixed-price upgrades off end-of-life software
description: >-
  Reid Morrison Inc. upgrades production applications off end-of-life software
  at a fixed price, for companies in PCI DSS, SOC 2, HIPAA and ISO 27001 scope.
  Rails and Ruby first. Starts with the Remediation Assessment: $12,500 fixed,
  two weeks, and the senior-management remediation plan your assessor asks for.
url: https://reidmorrison.com
author: Reid Morrison

# Company
entity:
  name: Reid Morrison Inc.
  # Reads as an apposition in the footer: "Reid Morrison Inc., a Florida
  # corporation". `form` is the register a procurement form asks for.
  form_short: a Florida corporation
  form: Florida profit corporation
  document: P26000043890
  address: 7901 4th St N, Ste 300, St. Petersburg, FL 33702

github_username: reidmorrison
linkedin_username: reidmorrison

# The design system, and ONLY the design system: three CSS partials
# (_includes/css/tokens.css, code.css, syntax.css) that stylesheets/site.css
# includes, so seven sites share one palette instead of a copy each.
#
# NO layout, include or navigation comes from the theme. This repo's _layouts
# and _includes win over a theme's, and the commercial chrome stays here: a doc
# site carrying /services, the entity block or a price would read to the Ruby
# community as a rug-pull risk on the gem itself.
#
# @v1 is a moving major tag. Pages rebuilds a site only when that site is
# pushed, so a theme change does not reach here until this repo is pushed.
remote_theme: reidmorrison/rm-docs-theme@v1

# Matches the project doc sites, so markdown behaves identically across them.
markdown: kramdown
kramdown:
  toc_levels: "2..3"

plugins:
  # Needed for LOCAL builds. Pages enables it on its own, but Jekyll only
  # auto-requires gems in the :jekyll_plugins bundler group, so without this line
  # a local build silently skips the theme, every {% include css/... %} in
  # site.css fails, and the site renders unstyled while production looks fine.
  - jekyll-remote-theme
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  # Here for exactly one redirect: `redirect_from` in services.md keeps
  # /assessment.html resolving. Remove this with that redirect rather than
  # leaving a plugin nothing uses.
  - jekyll-redirect-from

# The three third-party keys. Two rules cover all of them.
#
# PUBLIC BY DESIGN: each names a destination or a hostname and grants access to
# nothing, which is why they sit unredacted in a public repo.
#
# EACH IS ITS OWN OFF SWITCH: every page guards on the key being non-empty, so
# emptying one removes that feature everywhere. Changing any of them means
# changing /privacy.html in the same commit, which names all three as parties a
# visitor's browser contacts.

# Video call booking link. Renders a "Book a video call" button on the home
# page, /services.html, /security.html, /contact.html and /eol/. Empty means no
# button anywhere and the forms are the only route. A Google Calendar
# appointment schedule: the meeting name set there becomes the subject line on
# the prospect's own calendar.
booking_url: "https://calendar.app.google/wkaaAoqxXj1xoVUQ8"

# Web3Forms access key, gating BOTH lead forms: /contact.html and /eol/. While
# it is empty NEITHER form renders and both pages point at LinkedIn instead,
# because a form that discards submissions while telling the visitor it sent is
# worse than no form.
#
# CREATE IT WITH THE PUBLIC SALES ALIAS AT https://web3forms.com/ - submissions
# go to whichever address created the key. That alias is deliberately not
# written down in this repo, which is public.
web3forms_key: "018411c9-90f9-4b0f-aa92-b3c080d2c362"

# Cloudflare Web Analytics. The free JavaScript beacon, rendered into both
# shells by _includes/analytics.html.
#
# DNS IS UNTOUCHED, AND MUST STAY THAT WAY. The apex is on GoDaddy nameservers
# pointing at the GitHub Pages addresses, nothing is proxied, and the domain is
# not a Cloudflare zone. One hostname in a Cloudflare account plus one script
# tag is the whole integration.
cloudflare_analytics_token: "dd3a35c446b84f0f85c4cf5c0db17ded"

feed:
  path: feed.xml

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      # Blog posts live under /writing/. Scoped to posts rather than set
      # globally: a top-level `permalink` key switches *pages* to pretty URLs
      # too (about/index.html), which breaks the .html nav links shared with the
      # project doc sites.
      permalink: /writing/:year/:month/:day/:title/

exclude:
  - Gemfile
  - Gemfile.lock
  - CLAUDE.md
  - README.md
  - vendor
  # The test suite, and the throwaway build it makes to test against. Neither is
  # part of the published site. See test/README.md.
  - test
  # The logo master artwork, deliberately untracked. Excluding it keeps a local
  # build identical to production for whoever has a copy sitting in images/.
  - images/reid-morrison-consulting.png
