# Site identity. jekyll-seo-tag reads these for every page, so they set how the
# whole site is described in search results and link previews. They were the
# job-search positioning until 2026-08-28; this site now sells a service.
#
# `title` is the LEGAL NAME of the contracting entity, changed 2026-09-03 from
# "Reid Morrison Consulting". The corporation is `Reid Morrison Inc.` (Florida,
# document P26000043890) and it has no trading name, so "Consulting" on a public
# surface would be a fictitious name nobody registered. /security.html names the
# entity as the counterparty, and the tab title has to agree with it.
title: Reid Morrison Inc.

# `tagline` is the descriptive work the entity name no longer does: the
# corporation has no descriptor, so the offer has to be legible from the
# surrounding copy instead. Changed 2026-09-03 from the bare category
# "EOL Remediation", which named the market rather than what is sold.
#
# Honest note on where it renders: jekyll-seo-tag only uses `tagline` for the
# site root, and ONLY when that page sets no `title` of its own. index.md sets
# one, so this string is currently inert. It is set correctly anyway, because
# the day the home page drops its title this becomes the tab and the search
# result, and a stale value would be discovered by a buyer rather than by us.
# `description` below is the string that actually ships on every page.
tagline: Fixed-price upgrades off end-of-life software
description: >-
  Reid Morrison Inc. upgrades production applications off end-of-life software
  at a fixed price, for companies in PCI DSS, SOC 2, HIPAA and ISO 27001 scope.
  Rails and Ruby first. Starts with the Remediation Assessment: $12,500 fixed,
  two weeks, and the senior-management remediation plan your assessor asks for.
url: https://reidmorrison.com
author: Reid Morrison

# The contracting entity, exactly as it appears on the approved Florida
# Articles. THE ONE HOME for these facts: the footer on every page, the /eol/
# print letterhead and the procurement block on /security.html all read them
# from here. They are also what the W-9, the D-U-N-S record and the insurance
# certificate will carry, so a page that drifts from this block drifts from a
# document a procurement reviewer is holding.
entity:
  name: Reid Morrison Inc.
  # Reads as an apposition in the footer: "Reid Morrison Inc., a Florida
  # corporation". `form` is the register a procurement form asks for.
  form_short: a Florida corporation
  form: Florida profit corporation
  document: P26000043890
  address: 7901 4th St N, Ste 300, St. Petersburg, FL 33702

github_username: reidmorrison
linkedin_username: reidmorrison

# Kramdown settings match the project doc sites so markdown behaves identically
# across reidmorrison.com and logger/encryption/rocketjob/etc.
markdown: kramdown
kramdown:
  toc_levels: "2..3"

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  # Added 2026-09-03 for exactly one redirect: /assessment.html was a page in
  # its own right for six days, was in the sitemap, and folded into
  # /services.html. `redirect_from` there keeps the old URL resolving instead
  # of 404ing anything that indexed or bookmarked it. Whitelisted on GitHub
  # Pages. If that redirect is ever removed, remove this too rather than
  # leaving a plugin nothing uses.
  - jekyll-redirect-from

# Web3Forms access key for the lead form on /eol/. Public by design; it only
# identifies the destination inbox, it does not grant access to anything.
#
# CREATE IT WITH THE PUBLIC SALES ALIAS AT https://web3forms.com/ - submissions
# are delivered to whichever address the key was created with, and that address
# is the one that should receive them. The alias is deliberately not written
# down in this repo, which is public; see CLAUDE.md.
#
# While this is empty the form is NOT rendered and /eol/ points people at
# LinkedIn instead. That is deliberate: a form that discards submissions is
# worse than no form. Paste the key here and the form appears.
# Video call booking link, shown on /contact.html and the home page when set.
# Empty means no booking button is rendered anywhere, and the contact form is
# the only route. This is a Google Calendar appointment schedule; the meeting
# name set there becomes the subject line on the prospect's own calendar.
booking_url: "https://calendar.app.google/wkaaAoqxXj1xoVUQ8"

web3forms_key: "018411c9-90f9-4b0f-aa92-b3c080d2c362"

feed:
  path: feed.xml

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      # Blog posts live under /writing/. No posts yet, and no index page:
      # the scaffold is kept so a future post gets a URL and a feed entry.
      # Scoped to posts rather than set globally: a top-level `permalink` key
      # switches *pages* to pretty URLs too (about/index.html), which breaks the
      # .html nav links shared with the project doc sites.
      permalink: /writing/:year/:month/:day/:title/

exclude:
  - Gemfile
  - Gemfile.lock
  - CLAUDE.md
  - README.md
  - vendor
  # The logo master is untracked, so it is absent from a fresh clone and from
  # the Pages build. Excluding it keeps a local build byte-identical to
  # production for whoever has a copy sitting in images/. See CLAUDE.md.
  - images/reid-morrison-consulting.png
